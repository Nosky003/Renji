<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Renji</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Renji">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #ffffff;
      height: 100vh;
    }

    /* Barra superiore posizionata sotto la Dynamic Island / Notch */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: calc(env(safe-area-inset-top) + 8px); /* Margine dalla Dynamic Island */
      padding-left: 16px;
      padding-right: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e0e0e0; /* Linea grigia sottile di separazione */
    }

    .title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #000000;
      text-transform: uppercase;
    }

    /* Pulsanti circolari bianchi */
    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background-color: #ffffff;
      border: 1px solid #e0e0e0;
      box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Icona a 2 trattini neri orizzontali (Sinistra) */
    .lines-icon {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .lines-icon span {
      width: 14px;
      height: 2px;
      background-color: #000000;
      border-radius: 1px;
    }

    /* Icona a 3 pallini orizzontali (Destra) */
    .dots-icon {
      display: flex;
      gap: 3px;
    }

    .dots-icon span {
      width: 4px;
      height: 4px;
      background-color: #000000;
      border-radius: 50%;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <!-- Tasto sinistra: Cerchio bianco con 2 trattini -->
    <div class="icon-btn">
      <div class="lines-icon">
        <span></span>
        <span></span>
      </div>
    </div>

    <!-- Titolo centrale -->
    <div class="title">ciao</div>

    <!-- Tasto destra: Cerchio bianco con 3 pallini -->
    <div class="icon-btn">
      <div class="dots-icon">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </div>

</body>
</html>
