name: Build iOS IPA

on:
  push:
    branches: [ main, principale ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Prepare web assets folder
        run: |
          mkdir -p www
          cp index.html www/ 2>/dev/null || true
          cp menu.js www/ 2>/dev/null || true
          cp manifest.json www/ 2>/dev/null || true
          cp apple-touch-icon.png www/ 2>/dev/null || true

      - name: Install Dependencies & Setup Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@^5.0.0 @capacitor/cli@^5.0.0 @capacitor/ios@^5.0.0 @capacitor/keyboard@^5.0.0
          npx cap init Renji com.renji.app --web-dir www
          npx cap add ios
          npx cap sync ios

      - name: Configure Capacitor Keyboard Settings
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.renji.app",
            "appName": "Renji",
            "webDir": "www",
            "plugins": {
              "Keyboard": {
                "resize": "none",
                "style": "LIGHT",
                "resizeOnFullScreen": false
              }
            }
          }
          EOF
          npx cap copy ios

      - name: Hide iOS Keyboard Toolbar (Remove Accessory View)
        run: |
          cat << 'EOF' >> ios/App/App/AppDelegate.swift

          import WebKit

          extension WKWebView {
              override open var inputAccessoryView: UIView? {
                  return nil
              }
          }
          EOF

      - name: Build Xcode Project
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r Renji.ipa Payload

      - name: Upload Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Renji-IPA
          path: ios/App/Renji.ipa
